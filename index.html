async function startTriage(source){triageData={source,answers:{}};triageHistory=[];showScreen('screen-triage');if(source==='onboarding')renderSignupTriage('q1');else renderChangePhase();}
function renderSignupTriage(qid,addHistory=true){if(addHistory&&triageData.currentQ&&triageData.currentQ!==qid)triageHistory.push(triageData.currentQ);triageData.currentQ=qid;const backBtn=triageHistory.length>0?'<button class="btn-back show" onclick="signupTriageBack()">← Back</button>':'';const prog=document.getElementById('triage-progress');const content=document.getElementById('triage-content');if(qid==='q1'){prog.style.width='25%';content.innerHTML=backBtn+`<h1 class="page-title">Have you reached your goal weight?</h1><button class="btn btn-choice" onclick="signupTriageMsg('goal_reached')">Yes — I have reached my goal weight 🎉</button><button class="btn btn-choice" onclick="renderSignupTriage('q1b')">Not yet — I still have weight to lose</button>`;}else if(qid==='q1b'){prog.style.width='50%';content.innerHTML=backBtn+`<h1 class="page-title">What do you want to focus on next?</h1><button class="btn btn-choice" onclick="signupTriageMsg('keep_cutting')">Continuing to lose weight</button><button class="btn btn-choice" onclick="signupTriageMsg('take_break')">Taking a break from cutting</button><button class="btn btn-choice" onclick="signupTriageMsg('start_building')">Starting to build</button>`;}else if(qid==='q_redflags'){prog.style.width='75%';triageMulti=[];content.innerHTML=backBtn+`<h1 class="page-title">Quick body check</h1><p class="page-subtitle">Are you currently experiencing any of the following? Select all that apply.</p><div id="tf-wrap">${[['hair_loss','Hair loss or thinning'],['period_loss','Loss of period or irregular cycle'],['fatigue','Extreme fatigue'],['cold','Constantly feeling cold'],['obsessive','Obsessive thoughts about food'],['strength','Strength dropping significantly']].map(([v,l])=>`<button class="btn btn-choice" id="tf-${v}" onclick="toggleTF('${v}',this)">${l}</button>`).join('')}<button class="btn btn-choice" id="tf-none" onclick="tfNone()">None of these apply to me</button></div><button class="btn btn-primary mt-16" onclick="submitSignupTF()">Continue →</button>`;}}
function signupTriageBack(){if(triageHistory.length>0){const prev=triageHistory.pop();renderSignupTriage(prev,false);}}
function signupTriageMsg(choice){const content=document.getElementById('triage-content');document.getElementById('triage-progress').style.width='85%';const msgs={goal_reached:{title:'Incredible work! 🎉',body:"You've earned this! Now it's time to protect everything you've worked for. We're going to start you on a Reverse Diet to restore your metabolism.",phase:'reverse'},take_break:{title:'Smart move. 💗',body:"After a cutting period, your body needs time to restore your metabolism. We're going to start you on a Reverse Diet first.",phase:'reverse'},start_building:{title:'Love the ambition! 🙌',body:"Before we get there, your metabolism needs to recover first. We're going to start you on a Reverse Diet — trust the process.",phase:'reverse'}};if(msgs[choice]){const m=msgs[choice];content.innerHTML=`<h1 class="page-title">${m.title}</h1><p class="page-subtitle">${m.body}</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('${m.phase}')">Start my Reverse Diet →</button>`;}else if(choice==='keep_cutting'){content.innerHTML=`<h1 class="page-title">Let's get it! 💪</h1><p class="page-subtitle">We're going to make sure you're losing weight in the smartest, most sustainable way possible. First, a quick body check.</p><button class="btn btn-primary mt-32" onclick="renderSignupTriage('q_redflags')">Continue →</button>`;}}
function toggleTF(v,el){document.getElementById('tf-none').classList.remove('selected');el.classList.toggle('selected');triageMulti=el.classList.contains('selected')?[...triageMulti,v]:triageMulti.filter(x=>x!==v);}
function tfNone(){triageMulti=[];document.querySelectorAll('#tf-wrap .btn-choice').forEach(el=>el.classList.remove('selected'));document.getElementById('tf-none').classList.add('selected');triageMulti=['none'];}
function submitSignupTF(){const flags=triageMulti.filter(v=>v!=='none');triageData.answers.red_flags=flags;const content=document.getElementById('triage-content');document.getElementById('triage-progress').style.width='90%';if(flags.length>0){content.innerHTML=`<div class="warning-box"><h4>⚠️ Your body may be under stress</h4><p>The symptoms you've selected suggest that continuing to cut may not be serving your body right now. We strongly recommend beginning your reverse diet.</p></div><button class="btn btn-choice" onclick="finaliseTriage('reverse')">Start my reverse diet<small>Recommended — protect your metabolism</small></button><button class="btn btn-choice" onclick="showTriageRiskAck()">I understand the risks and choose to continue cutting</button>`;}else finaliseTriage('cut');}
function showTriageRiskAck(){triageData.answers.risk_acknowledged=true;document.getElementById('triage-content').innerHTML=`<h1 class="page-title">Before you continue</h1><p class="page-subtitle">Please acknowledge one of the following:</p><button class="btn btn-choice" onclick="finaliseTriage('cut')">I am aware of the risks and choose to continue cutting anyway</button><button class="btn btn-choice" onclick="finaliseTriage('cut')">I am currently working with Kimmy or a trusted naturopath / functional GP</button><button class="btn-ghost" onclick="renderSignupTriage('q_redflags')">← Go back</button>`;}
async function renderChangePhase(){const prog=document.getElementById('triage-progress');const content=document.getElementById('triage-content');prog.style.width='20%';const p=profile.current_phase;let btns='<h1 class="page-title">Change My Phase</h1><p class="page-subtitle">Where do you want to go next?</p>';if(p==='cut'){btns+='<button class="btn btn-choice" onclick="changePhaseOption(\'cut_already\')">✂️ I want to start cutting</button><button class="btn btn-choice" onclick="changePhaseOption(\'reverse\')">🔄 I want to reverse diet</button><button class="btn btn-choice" onclick="changePhaseOption(\'maintain\')">⚖️ I want to maintain my weight</button><button class="btn btn-choice" onclick="changePhaseOption(\'build\')">💪 I want to start building</button>';}else if(p==='reverse'){btns+='<button class="btn btn-choice" onclick="changePhaseOption(\'cut\')">✂️ I want to start cutting</button><button class="btn btn-choice" onclick="changePhaseOption(\'maintain\')">⚖️ I want to maintain my weight</button><button class="btn btn-choice" onclick="changePhaseOption(\'build\')">💪 I want to start building</button>';}else if(p==='maintain'){btns+='<button class="btn btn-choice" onclick="changePhaseOption(\'cut\')">✂️ I want to start cutting</button><button class="btn btn-choice" onclick="changePhaseOption(\'maintain_already\')">⚖️ I want to maintain my weight</button><button class="btn btn-choice" onclick="changePhaseOption(\'build\')">💪 I want to start building</button>';}else if(p==='build'){btns+='<button class="btn btn-choice" onclick="changePhaseOption(\'cut\')">✂️ I want to start cutting</button><button class="btn btn-choice" onclick="changePhaseOption(\'maintain\')">⚖️ I want to maintain my weight</button><button class="btn btn-choice" onclick="changePhaseOption(\'build_already\')">💪 I want to start building</button>';}btns+='<button class="btn-ghost" onclick="loadDashboard()">← Back to dashboard</button>';content.innerHTML=btns;}
async function changePhaseOption(option){const content=document.getElementById('triage-content');document.getElementById('triage-progress').style.width='60%';const cp=profile.current_phase;if(option==='cut_already'){content.innerHTML=`<h1 class="page-title">You're already cutting! ✂️</h1><p class="page-subtitle">Keep going — you're already in a Cut phase.</p><button class="btn btn-primary mt-32" onclick="loadDashboard()">Back to dashboard →</button>`;return;}if(option==='maintain_already'){content.innerHTML=`<h1 class="page-title">You're already maintaining! ⚖️</h1><p class="page-subtitle">Keep checking in each week and trust the process.</p><button class="btn btn-primary mt-32" onclick="loadDashboard()">Back to dashboard →</button>`;return;}if(option==='build_already'){content.innerHTML=`<h1 class="page-title">You're already building! 💪</h1><p class="page-subtitle">Stay consistent, keep checking in, and trust the process.</p><button class="btn btn-primary mt-32" onclick="loadDashboard()">Back to dashboard →</button>`;return;}const{data:phaseCheckins}=await db.from('checkins').select('id').eq('user_id',currentUser.id).eq('phase',cp).neq('result','phase_change').not('deleted','is',true);const checkinsInPhase=phaseCheckins?phaseCheckins.length:0;if(option==='cut'){if(cp==='reverse'&&checkinsInPhase<10){content.innerHTML=`<div class="warning-box"><h4>⚠️ Heads up</h4><p>You've completed ${checkinsInPhase} out of 10 check-ins in your Reverse Diet. Your body needs time to adapt.</p></div><button class="btn btn-choice" onclick="finaliseTriage('cut')">Accept risk — change anyway<small>I understand this isn't recommended</small></button><button class="btn btn-choice" onclick="loadDashboard()">Stay where I am<small>Stick to the plan 💪</small></button>`;return;}content.innerHTML=`<h1 class="page-title">Let's go! 🔥</h1><p class="page-subtitle">We're dropping your calories and setting you up for a smart, sustainable cut.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('cut')">Start my Cut →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}else if(option==='reverse'){content.innerHTML=`<h1 class="page-title">Smart decision. 💗</h1><p class="page-subtitle">We're going to gradually increase your calories to restore your metabolism.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('reverse')">Start my Reverse Diet →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}else if(option==='maintain'){if(cp==='cut'){content.innerHTML=`<h1 class="page-title">Love this decision. 💗</h1><p class="page-subtitle">Before we get you to maintenance, your body needs time to recover first. We're starting you on a Reverse Diet.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('reverse')">Start my Reverse Diet →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}else if(cp==='reverse'){content.innerHTML=`<h1 class="page-title">You've put in the work! ⚖️</h1><p class="page-subtitle">Now it's time to live here for a while. We're locking in your maintenance calories.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('maintain')">Start Maintenance →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}else if(cp==='build'){content.innerHTML=`<h1 class="page-title">Pulling back and stabilising. ⚖️</h1><p class="page-subtitle">We're dropping your calories slightly and setting your maintenance anchor.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('maintain')">Start Maintenance →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}}else if(option==='build'){if(cp==='cut'){content.innerHTML=`<h1 class="page-title">Not so fast! 🛑</h1><p class="page-subtitle">You can't move directly from Cut to Build — your metabolism needs time to recover first. We're starting your Reverse Diet now.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('reverse')">Start my Reverse Diet →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}else if(cp==='reverse'&&checkinsInPhase<10){content.innerHTML=`<div class="warning-box"><h4>⚠️ Heads up</h4><p>You've completed ${checkinsInPhase} out of 10 check-ins in your Reverse Diet. Your body needs time to adapt.</p></div><button class="btn btn-choice" onclick="finaliseTriage('build')">Accept risk — change anyway<small>I understand this isn't recommended</small></button><button class="btn btn-choice" onclick="loadDashboard()">Stay where I am<small>Stick to the plan 💪</small></button>`;return;}else{content.innerHTML=`<h1 class="page-title">Let's build something incredible! 💪</h1><p class="page-subtitle">Your body is primed and ready — we're increasing your calories and setting you up for a smart build phase.</p><button class="btn btn-primary mt-32" onclick="finaliseTriage('build')">Start my Build →</button><button class="btn-ghost" onclick="renderChangePhase()">← Back</button>`;}}}

async function finaliseTriage(phase){document.getElementById('triage-progress').style.width='100%';document.getElementById('triage-content').innerHTML=`<div class="spinner-wrap"><div class="spinner"></div><p class="text-mid">Setting up your Compass…</p></div>`;try{const isNew=!profile;const prevPhase=profile&&profile.current_phase;const baseCal=obData.current_calories||(profile&&profile.current_calories)||1500;let newCal=baseCal;if(!isNew){if(phase==='cut')newCal=baseCal-100;if(phase==='reverse')newCal=baseCal+50;if(phase==='build')newCal=baseCal+100;if(phase==='maintain'&&prevPhase==='build')newCal=baseCal-100;}newCal=Math.max(1200,newCal);const resetAnchor=phase==='maintain'&&prevPhase!=='maintain';const bioSex=obData.biological_sex||(profile&&profile.biological_sex)||'prefer_not_to_say';const stepTarget=obData.step_target||(profile&&profile.step_target)||null;const pd={user_id:currentUser.id,email:currentUser.email,name:obData.name||(profile&&profile.name)||(currentUser.user_metadata&&currentUser.user_metadata.full_name)||'',macro_bodyweight:obData.macro_bodyweight||(profile&&profile.macro_bodyweight),biological_sex:bioSex,current_calories:newCal,current_phase:phase,step_target:stepTarget,red_flags:triageData.answers.red_flags||[],risk_acknowledged:triageData.answers.risk_acknowledged||false,maintenance_anchor_weight:resetAnchor?null:((profile&&profile.maintenance_anchor_weight)||null),weeks_at_1200:(profile&&profile.weeks_at_1200)||0,updated_at:new Date().toISOString()};if(isNew)pd.created_at=new Date().toISOString();let data,error;if(isNew){const res=await db.from('profiles').insert(pd).select().single();data=res.data;error=res.error;}else{const res=await db.from('profiles').update(pd).eq('user_id',currentUser.id).select().single();data=res.data;error=res.error;}if(error){alert('Error saving: '+error.message);return;}const oldPhase=prevPhase;profile=data;if(!isNew)await logPhaseChange(oldPhase,phase);if(isNew&&obData.weight_last_week&&obData.weight_this_week){const now=new Date();const lastWeek=new Date(now.getTime()-7*24*60*60*1000);await db.from('checkins').insert({user_id:currentUser.id,phase,is_outlier:false,weight:obData.weight_last_week,calories_before:newCal,calories_after:newCal,result:'onboarding',result_message:'Onboarding weight (last week)',created_at:lastWeek.toISOString()});await db.from('checkins').insert({user_id:currentUser.id,phase,is_outlier:false,weight:obData.weight_this_week,calories_before:newCal,calories_after:newCal,result:'onboarding',result_message:'Onboarding weight (this week)',created_at:now.toISOString()});}try{localStorage.removeItem('ob_'+currentUser.id);}catch(e){}}catch(e){alert('Unexpected error: '+e.message);return;}const phaseLabel={cut:'Cut',reverse:'Reverse Diet',maintain:'Maintenance',build:'Build'};const macros=calcMacros(profile.current_calories,profile.macro_bodyweight,profile.current_phase);document.getElementById('triage-content').innerHTML=`<div class="result-box"><div class="result-icon">🎯</div><h2 class="result-title">You're in the ${phaseLabel[phase]} phase!</h2></div><ul class="checklist"><li><span class="check-mark">✓</span>Phase set: ${phaseLabel[phase]}</li><li><span class="check-mark">✓</span>Daily calories: ${profile.current_calories} kcal</li><li><span class="check-mark">✓</span>Protein: ${macros.protein}g · Fats: ${macros.fats}g · Carbs: ${macros.carbs}g</li>${profile.step_target?`<li><span class="check-mark">✓</span>Step target: ${profile.step_target.toLocaleString()} steps/day</li>`:''}</ul><button class="btn btn-primary mt-24" onclick="loadDashboard()">Go to my Compass →</button>`;}

async function logPhaseChange(fromPhase,toPhase){if(!fromPhase||fromPhase===toPhase)return;const pLabel={cut:'Cut',reverse:'Reverse Diet',maintain:'Maintenance',build:'Build'};const m=calcMacros(profile.current_calories,profile.macro_bodyweight,toPhase);await db.from('checkins').insert({user_id:currentUser.id,phase:toPhase,is_outlier:false,result:'phase_change',result_message:`Phase changed: ${pLabel[fromPhase]||fromPhase} → ${pLabel[toPhase]||toPhase}`,calories_before:profile.current_calories,calories_after:profile.current_calories,protein:m.protein,fats:m.fats,carbs:m.carbs,created_at:new Date().toISOString()});}

async function loadDashboard(){showScreen('screen-dashboard');showTab('home');renderHome();}
async function renderHome(){const macros=calcMacros(profile.current_calories,profile.macro_bodyweight,profile.current_phase);const h=new Date().getHours();const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';const pLabel={cut:'Cut Phase',reverse:'Reverse Diet',maintain:'Maintenance',build:'Build Phase'};const{data:latestCI}=await db.from('checkins').select('weight').eq('user_id',currentUser.id).not('weight','is',null).neq('result','phase_change').not('deleted','is',true).order('created_at',{ascending:false}).limit(1);const{data:firstCI}=await db.from('checkins').select('weight').eq('user_id',currentUser.id).not('weight','is',null).neq('result','phase_change').not('deleted','is',true).order('created_at',{ascending:true}).limit(1);const displayWeight=(latestCI&&latestCI.length>0)?latestCI[0].weight:profile.macro_bodyweight;const startWeight=(firstCI&&firstCI.length>0)?firstCI[0].weight:null;const totalCal=(macros.protein*4)+(macros.fats*9)+(macros.carbs*4);const pPct=Math.round((macros.protein*4)/totalCal*100);const fPct=Math.round((macros.fats*9)/totalCal*100);const cPct=100-pPct-fPct;const circ=289;const pDash=Math.round(pPct/100*circ);const fDash=Math.round(fPct/100*circ);const cDash=circ-pDash-fDash;const fOff=-(pDash);const cOff=-(pDash+fDash);let goalHtml='';if(profile.goal_weight&&displayWeight){const toGo=Math.abs(Math.round((fromKg(displayWeight)-fromKg(profile.goal_weight))*10)/10);const{data:chartData}=await db.from('checkins').select('weight,created_at').eq('user_id',currentUser.id).not('weight','is',null).neq('result','phase_change').not('deleted','is',true).order('created_at',{ascending:true}).limit(8);goalHtml=buildGoalChart(chartData||[],profile.goal_weight,displayWeight,toGo);}
const stepHtml=profile.step_target?`<div class="dash-stat-card"><div class="dash-stat-label">Step Target</div><div class="dash-stat-value">${profile.step_target.toLocaleString()}</div></div>`:`<div></div>`;
document.getElementById('tab-home').innerHTML=`<div class="dash-greeting dash-fade"><h1>${greet}, ${profile.name||'lovely'} 👋</h1><p>Here's where you're at this week.</p></div><div class="dash-fade"><div class="dash-phase-badge"><span class="dash-phase-dot"></span> ${pLabel[profile.current_phase]}</div></div><div class="dash-cal-hero dash-fade"><div class="dash-cal-label">Daily Calories</div><div class="dash-cal-number">${profile.current_calories}</div><div class="dash-cal-unit">kcal per day</div></div><div class="dash-macro-wrap dash-fade"><div class="dash-donut-wrap"><svg viewBox="0 0 120 120" class="dash-donut-svg"><circle cx="60" cy="60" r="46" fill="none" stroke="#F3E8FF" stroke-width="14"/><circle cx="60" cy="60" r="46" fill="none" stroke="#FF5501" stroke-width="14" stroke-dasharray="${pDash} ${circ-pDash}" stroke-dashoffset="72" stroke-linecap="round"/><circle cx="60" cy="60" r="46" fill="none" stroke="#DEADF6" stroke-width="14" stroke-dasharray="${fDash} ${circ-fDash}" stroke-dashoffset="${72+fOff}" stroke-linecap="round"/><circle cx="60" cy="60" r="46" fill="none" stroke="#FFB3E6" stroke-width="14" stroke-dasharray="${cDash} ${circ-cDash}" stroke-dashoffset="${72+cOff}" stroke-linecap="round"/><text x="60" y="55" text-anchor="middle" font-family="Clash Display,sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">${profile.current_calories}</text><text x="60" y="70" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="9" fill="#6B7280">kcal</text></svg></div><div class="dash-macro-list"><div class="dash-macro-row"><span class="dash-macro-dot" style="background:#FF5501"></span><span class="dash-macro-name">Protein <span class="dash-macro-pct">${pPct}%</span></span><span class="dash-macro-val">${macros.protein}g</span></div><div class="dash-macro-row"><span class="dash-macro-dot" style="background:#DEADF6;border:1.5px solid #cbb5f0"></span><span class="dash-macro-name">Fats <span class="dash-macro-pct">${fPct}%</span></span><span class="dash-macro-val">${macros.fats}g</span></div><div class="dash-macro-row"><span class="dash-macro-dot" style="background:#FFB3E6"></span><span class="dash-macro-name">Carbs <span class="dash-macro-pct">${cPct}%</span></span><span class="dash-macro-val">${macros.carbs}g</span></div></div></div><div class="dash-stats-row dash-fade"><div class="dash-stat-card"><div class="dash-stat-label">Current Weight</div><div class="dash-stat-value">${wLabel(displayWeight)}</div></div>${stepHtml}</div>${startWeight&&startWeight!==displayWeight?`<div class="dash-stats-row dash-fade"><div class="dash-stat-card"><div class="dash-stat-label">Starting Weight</div><div class="dash-stat-value">${wLabel(startWeight)}</div></div><div></div></div>`:''}`+goalHtml+`<div id="trigger-msg"></div><button class="btn btn-primary dash-fade" onclick="startCheckin()">Weekly Check-In →</button><button class="btn-action dash-fade" onclick="startTriage('phase_change')">Change My Phase</button>`;checkAutoTriggers();}

function buildGoalChart(data,goalKg,currentKg,toGo){const W=320,H=130,PL=22,PB=18,PT=10,PR=12,cW=W-PL-PR,cH=H-PT-PB;const weights=data.map(d=>d.weight).filter(Boolean);if(!weights.length)weights.push(currentKg);const allVals=[...weights,goalKg];const rawMin=Math.min(...allVals),rawMax=Math.max(...allVals);const pad=Math.max((rawMax-rawMin)*0.3,1);const yMin=rawMin-pad,yMax=rawMax+pad;const toX=i=>PL+(data.length>1?(i/(data.length-1))*cW:cW/2);const toY=v=>PT+cH-((v-yMin)/(yMax-yMin))*cH;const goalY=toY(goalKg);let grid='';for(let i=0;i<=3;i++){const v=yMin+(yMax-yMin)*(i/3),y=toY(v),lbl=getUnit()==='lbs'?Math.round(v*2.20462):(Math.round(v*10)/10);grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#F3E8FF" stroke-width="1"/><text x="0" y="${y+3}" font-family="Plus Jakarta Sans,sans-serif" font-size="8" fill="#C4AEDE" font-weight="600">${lbl}</text>`;}const pts=data.map((d,i)=>`${toX(i)},${toY(d.weight)}`).join(' ');let area='';if(data.length>=2)area=`<path d="M${toX(0)},${toY(data[0].weight)} ${data.map((d,i)=>`L${toX(i)},${toY(d.weight)}`).join(' ')} L${toX(data.length-1)},${PT+cH} L${toX(0)},${PT+cH} Z" fill="url(#gfill)" clip-path="url(#gclip)"/>`;let dlbls='';if(data.length>=1){const fmt=d=>{const dt=new Date(d.created_at);return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};dlbls+=`<text x="${toX(0)}" y="${H}" font-family="Plus Jakarta Sans,sans-serif" font-size="8" fill="#C4AEDE" text-anchor="middle" font-weight="600">${fmt(data[0])}</text>`;if(data.length>1)dlbls+=`<text x="${toX(data.length-1)}" y="${H}" font-family="Plus Jakarta Sans,sans-serif" font-size="8" fill="#FF5501" text-anchor="middle" font-weight="700">${fmt(data[data.length-1])}</text>`;}const dots=data.map((d,i)=>{const x=toX(i),y=toY(d.weight),isLast=i===data.length-1;return isLast?`<circle cx="${x}" cy="${y}" r="5" fill="#FF5501" stroke="white" stroke-width="2.5"/>`:`<circle cx="${x}" cy="${y}" r="3" fill="white" stroke="#333" stroke-width="1.8"/>`;}).join('');const gLbl=getUnit()==='lbs'?Math.round(goalKg*2.20462)+'lbs':(Math.round(goalKg*10)/10)+'kg';return`<div class="dash-goal-card dash-fade" style="position:relative;"><button onclick="removeGoalWeight()" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#E8D5F5;border:none;color:#9B7BB8;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.15);" onmouseover="this.style.background='#FF5501';this.style.color='white'" onmouseout="this.style.background='#E8D5F5';this.style.color='#9B7BB8'">×</button><div style="margin-bottom:14px;"><div class="dash-stat-label">Current Weight</div><div class="dash-stat-value">${wLabel(currentKg)}</div><div style="font-size:12px;color:var(--mid);margin-top:2px;">${toGo}${getUnit()} from your goal</div></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible;"><defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#333" stop-opacity="0.1"/><stop offset="100%" stop-color="#333" stop-opacity="0"/></linearGradient><clipPath id="gclip"><rect x="${PL}" y="${PT}" width="${cW}" height="${cH}"/></clipPath></defs>${grid}<line x1="${PL}" y1="${goalY}" x2="${W-PR}" y2="${goalY}" stroke="#FF5501" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/><text x="${W-PR+2}" y="${goalY+3}" font-family="Plus Jakarta Sans,sans-serif" font-size="8" fill="#FF5501" font-weight="700">${gLbl}</text>${data.length>=2?area:''}${data.length>=2?`<polyline points="${pts}" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dots}${dlbls}</svg></div>`;}
async function removeGoalWeight(){if(!confirm('Remove your goal weight from the dashboard?'))return;await db.from('profiles').update({goal_weight:null,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);profile.goal_weight=null;renderHome();}
async function checkAutoTriggers(){if(!profile||profile.current_phase!=='maintain')return;const{data}=await db.from('checkins').select('created_at').eq('user_id',currentUser.id).eq('phase','maintain').order('created_at',{ascending:true}).limit(1);if(data?.length){const weeks=Math.floor((Date.now()-new Date(data[0].created_at))/6048e5);if(weeks>=16){const el=document.getElementById('trigger-msg');if(el)el.innerHTML=`<div class="warning-box mt-16"><h4>🔄 Time to reassess your goal</h4><p>You've been maintaining for ${weeks} weeks. It might be time to set a new goal.</p><button class="btn-action mt-16" onclick="startTriage('reassess')" style="font-size:15px;padding:12px 20px;">Reassess now →</button></div>`;}}}
// ── CHECK-IN ────────────────────────────────────────────────
function startCheckin(){checkinData={phase:profile.current_phase};checkinRedFlags=[];showScreen('screen-checkin');renderCI(0);}
function setCI(pct,html){document.getElementById('ci-progress').style.width=pct+'%';document.getElementById('ci-content').innerHTML=html;}

async function renderCI(step){
  if(step===0)setCI(15,`<h1 class="page-title">Weekly Check-In 🧭</h1><p class="page-subtitle">Before we look at your numbers — was this a normal week?</p><button class="btn btn-choice" onclick="ciWeek('normal')">✅ Yes — totally normal week</button><button class="btn btn-choice" onclick="ciWeek('period')">🩸 Period or hormonal week</button><button class="btn btn-choice" onclick="ciWeek('illness')">🤒 I was sick</button><button class="btn btn-choice" onclick="ciWeek('stress')">😵 High stress, travel, or disrupted routine</button><button class="btn-ghost" onclick="loadDashboard()">← Back to dashboard</button>`);
  else if(step===1)setCI(30,`<button class="btn-back show" onclick="renderCI(0)">← Back</button><h1 class="page-title">Adherence check</h1><p class="page-subtitle">Were you 80% or more adherent to your calorie plan this week?</p><button class="btn btn-choice" onclick="ciAdherence(true)">✅ Yes — 80% or more</button><button class="btn btn-choice" onclick="ciAdherence(false)">❌ No — I was off plan</button>`);
  else if(step===2){
    if(profile.current_phase!=='cut'){renderCI(3);return;}
    const{data:recentTriage}=await db.from('checkins').select('created_at').eq('user_id',currentUser.id).eq('result','phase_change').order('created_at',{ascending:false}).limit(1);
    if(recentTriage&&recentTriage.length>0&&(Date.now()-new Date(recentTriage[0].created_at))<7*24*60*60*1000){renderCI(3);return;}
    checkinRedFlags=[];
    setCI(45,`<h1 class="page-title">Quick body check</h1><p class="page-subtitle">Are you currently experiencing any of the following? Select all that apply.</p><div id="ci-flags">${[['hair_loss','Hair loss or thinning'],['period_loss','Loss of period or irregular cycle'],['fatigue','Extreme fatigue (beyond normal tiredness)'],['cold','Constantly feeling cold'],['obsessive','Obsessive thoughts about food'],['strength','Strength dropping significantly']].map(([v,l])=>`<button class="btn btn-choice" id="cif-${v}" onclick="toggleCIRF('${v}',this)">${l}</button>`).join('')}<button class="btn btn-choice" id="cif-none" onclick="ciNoFlags()">None of these apply</button></div><button class="btn btn-primary mt-16" onclick="submitCIRF()">Continue →</button>`);
  }
  else if(step===3)setCI(60,`<button class="btn-back show" onclick="renderCI(2)">← Back</button><h1 class="page-title">This week's measurements</h1><p class="page-subtitle">Enter your average weight and waist measurement for this week.</p><div class="field mt-24"><label>Average weight this week (${getUnit()})</label><input type="number" id="ci-weight" placeholder="${getUnit()==='lbs'?'e.g. 141.5':'e.g. 64.3'}" step="0.1" min="${getUnit()==='lbs'?66:30}" max="${getUnit()==='lbs'?660:300}" /></div><div class="field"><label>Waist measurement this week (cm)</label><input type="number" id="ci-waist" placeholder="e.g. 74.5" step="0.1" min="40" max="200" /><div class="info-box"><strong>How to measure:</strong> Around your natural waist, just above your belly button, on bare skin, after breathing out normally.</div></div><button class="btn btn-primary mt-8" onclick="submitCIWeight()">Continue →</button>`);
  else if(step===4)setCI(75,`<button class="btn-back show" onclick="renderCI(3)">← Back</button><h1 class="page-title">Your steps this week 👟</h1><p class="page-subtitle">What was your average daily step count this week?</p><div class="field mt-24"><label>Average daily steps</label><input type="number" id="ci-steps" placeholder="e.g. 8500" min="0" max="50000" /></div><button class="btn btn-primary mt-16" onclick="submitCISteps()">Continue →</button><button class="btn-ghost" onclick="ciNoSteps()">I didn't track this week</button><div id="ci-no-steps-msg" style="display:none;" class="info-box mt-16">The goal of this program is to keep your calories as high as possible for as long as possible. When you hit a plateau, increasing steps by 1,000 a day can get things moving again without dropping a single calorie. Track them every week so we always have that option available to you.</div>`);
  else if(step===5){if(profile.current_phase==='build')setCI(90,`<h1 class="page-title">How are you feeling?</h1><p class="page-subtitle">Are you experiencing uncomfortable fullness or digestive discomfort?</p><button class="btn btn-choice" onclick="ciDiscomfort(false)">No — feeling good</button><button class="btn btn-choice" onclick="ciDiscomfort(true)">Yes — uncomfortable fullness or discomfort</button>`);else processCheckin();}
}

function ciWeek(v){checkinData.week=v;if(v!=='normal')setCI(25,`<h1 class="page-title">Log your measurements</h1><p class="page-subtitle">We won't adjust your calories this week, but let's keep your record complete.</p><div class="field mt-24"><label>Average weight this week (${getUnit()})</label><input type="number" id="ci-ow" placeholder="${getUnit()==='lbs'?'e.g. 141.5':'e.g. 64.3'}" step="0.1" min="${getUnit()==='lbs'?66:30}" max="${getUnit()==='lbs'?660:300}" /></div><div class="field"><label>Waist measurement this week (cm)</label><input type="number" id="ci-owaist" placeholder="e.g. 74.5" step="0.1" min="40" max="200" /></div><div class="field"><label>Average daily steps (optional)</label><input type="number" id="ci-osteps" placeholder="e.g. 8500" min="0" max="50000" /></div><button class="btn btn-primary mt-16" onclick="saveOutlier('${v}')">Save & finish</button><button class="btn-ghost" onclick="loadDashboard()">Back to dashboard (don't log this week)</button>`);else renderCI(1);}

async function saveOutlier(reason){const w=parseFloat(document.getElementById('ci-ow')?.value);const waist=parseFloat(document.getElementById('ci-owaist')?.value)||null;const steps=parseInt(document.getElementById('ci-osteps')?.value)||null;const minV=getUnit()==='lbs'?66:30,maxV=getUnit()==='lbs'?660:300;if(!w||w<minV||w>maxV){alert('Please enter your weight before saving.');return;}const reasonLabels={period:'Period / hormonal week',illness:'Sick this week',stress:'High stress or disrupted routine'};await saveCI({weight:toKg(w),waist,steps_this_week:steps,is_outlier:true,outlier_reason:reasonLabels[reason]||reason,calories_before:profile.current_calories,calories_after:profile.current_calories,result:'hold_outlier',result_message:'Outlier week — calories held'});showResult({type:'hold_outlier',newCal:profile.current_calories,oldCal:profile.current_calories,msg:"Life happened this week — no changes made. Reset, refocus, and we'll check in again next week."});}

function ciAdherence(v){checkinData.adherent=v;if(!v)setCI(40,`<h1 class="page-title">Log your measurements</h1><p class="page-subtitle">Since adherence was below 80%, we'll hold your calories and try again next week.</p><div class="field mt-24"><label>Average weight this week (${getUnit()})</label><input type="number" id="ci-naw" placeholder="${getUnit()==='lbs'?'e.g. 141.5':'e.g. 64.3'}" step="0.1" min="${getUnit()==='lbs'?66:30}" max="${getUnit()==='lbs'?660:300}" /></div><div class="field"><label>Waist measurement this week (cm)</label><input type="number" id="ci-nawaist" placeholder="e.g. 74.5" step="0.1" min="40" max="200" /></div><div class="field"><label>Average daily steps (optional)</label><input type="number" id="ci-nasteps" placeholder="e.g. 8500" min="0" max="50000" /></div><button class="btn btn-primary mt-16" onclick="saveNonAdherent()">Save & finish</button>`);else renderCI(2);}

async function saveNonAdherent(){const w=parseFloat(document.getElementById('ci-naw')?.value);const waist=parseFloat(document.getElementById('ci-nawaist')?.value)||null;const steps=parseInt(document.getElementById('ci-nasteps')?.value)||null;const minV=getUnit()==='lbs'?66:30,maxV=getUnit()==='lbs'?660:300;if(!w||w<minV||w>maxV){alert('Please enter your weight before saving.');return;}await saveCI({weight:toKg(w),waist,steps_this_week:steps,is_outlier:true,outlier_reason:'Non-adherent week',calories_before:profile.current_calories,calories_after:profile.current_calories,result:'hold_non_adherent',result_message:'Non-adherent week — calories held'});showResult({type:'hold_non_adherent',newCal:profile.current_calories,oldCal:profile.current_calories,msg:"No judgment, it happens! Complete the debrief to help get back on track this week and we'll reassess together next check-in."});}

function toggleCIRF(v,el){document.getElementById('cif-none').classList.remove('selected');el.classList.toggle('selected');checkinRedFlags=el.classList.contains('selected')?[...checkinRedFlags,v]:checkinRedFlags.filter(x=>x!==v);}
function ciNoFlags(){checkinRedFlags=[];document.querySelectorAll('#ci-flags .btn-choice').forEach(el=>el.classList.remove('selected'));document.getElementById('cif-none').classList.add('selected');}
function submitCIRF(){checkinData.red_flags=checkinRedFlags;if(checkinRedFlags.length>0)setCI(55,`<div class="warning-box"><h4>⚠️ Your body is showing signs of stress</h4><p>The symptoms you've selected suggest that a calorie deficit may no longer be serving your body. We strongly recommend beginning your reverse diet now.</p></div><button class="btn btn-choice" onclick="ciForceReverse()">Start my reverse diet<small>Recommended — your body needs this</small></button><button class="btn btn-choice" onclick="ciRiskAck()">I understand the risks and choose to continue cutting</button>`);else renderCI(3);}
async function ciForceReverse(){await db.from('profiles').update({current_phase:'reverse',updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);profile.current_phase='reverse';await flagAdmin('auto_phase_change',{from:'cut',to:'reverse',reason:'red_flags'});setCI(58,`<h1 class="page-title">Phase updated 💗</h1><p class="page-subtitle">Your phase has been changed to Reverse Diet. Complete your check-in now.</p><button class="btn btn-primary mt-24" onclick="renderCI(3)">Continue →</button>`);}
function ciRiskAck(){setCI(57,`<h1 class="page-title">Before you continue</h1><div style="margin:24px 0;"><button class="btn btn-choice" onclick="ciAckContinue()">I am aware of the risks and choose to continue cutting anyway</button><button class="btn btn-choice" onclick="ciAckContinue()">I am currently working with Kimmy or a trusted naturopath / functional GP</button></div>`);}
async function ciAckContinue(){await flagAdmin('red_flag_override',{flags:checkinData.red_flags});renderCI(3);}

function submitCIWeight(){const raw=parseFloat(document.getElementById('ci-weight').value);const waistRaw=parseFloat(document.getElementById('ci-waist').value);const minVal=getUnit()==='lbs'?66:30,maxVal=getUnit()==='lbs'?660:300;if(!raw||raw<minVal||raw>maxVal){alert('Please enter a valid weight in '+getUnit()+'.');return;}if(!waistRaw||waistRaw<40||waistRaw>200){alert('Please enter a valid waist measurement in cm.');return;}checkinData.weight=toKg(raw);checkinData.waist=waistRaw;renderCI(4);}

function submitCISteps(){const s=parseInt(document.getElementById('ci-steps').value);if(!s||s<0||s>50000){alert('Please enter a valid step count.');return;}checkinData.steps_this_week=s;checkinData.tracked_steps=true;renderCI(5);}
function ciNoSteps(){checkinData.steps_this_week=null;checkinData.tracked_steps=false;document.getElementById('ci-no-steps-msg').style.display='block';setTimeout(()=>renderCI(5),3500);}
function ciDiscomfort(v){checkinData.discomfort=v;processCheckin();}
// ── CORE CALCULATION ────────────────────────────────────────
async function processCheckin(){
  setCI(95,`<div class="spinner-wrap"><div class="spinner"></div><p class="text-mid">Calculating your recommendation…</p></div>`);
  const{data:prev}=await db.from('checkins').select('*').eq('user_id',currentUser.id).eq('is_outlier',false).not('weight','is',null).neq('result','phase_change').not('deleted','is',true).order('created_at',{ascending:false}).limit(5);
  const cw=checkinData.weight;
  const cWaist=checkinData.waist||null;
  const cSteps=checkinData.steps_this_week||null;
  const trackedSteps=checkinData.tracked_steps||false;
  const phase=profile.current_phase;
  let newCal=profile.current_calories,result='',msg='';

  // Not enough data yet
  if(!prev||prev.length<3){
    const isFirst=!prev||prev.length===0;
    const rt=isFirst?'first_checkin':'second_checkin';
    const rm=isFirst?"You're in the system! We need a couple more weeks of data before making a recommendation — see you next week!":"Good data coming in! One more week and we'll have enough to make your first recommendation.";
    await saveCI({weight:cw,waist:cWaist,steps_this_week:cSteps,is_outlier:false,calories_before:profile.current_calories,calories_after:profile.current_calories,result:rt,result_message:rm});
    showResult({type:rt,newCal:profile.current_calories,oldCal:profile.current_calories,msg:rm});return;
  }

  const pw=prev[0].weight;
  const scaleDiff=cw-pw; // positive=gained, negative=lost
  const prevWithWaist=prev.find(r=>r.waist!=null);
  const prevWaist=prevWithWaist?prevWithWaist.waist:null;
  const waistDiff=cWaist!==null&&prevWaist!==null?prevWaist-cWaist:null; // positive=waist got smaller

  // Helper: pull deficit lever
  const pullLever=(lMsg)=>{
    const hasStepHistory=trackedSteps&&profile.step_target;
    // Check if they used steps last week — if so, force calories this time
    const lastResult=prev[0]?.result;
    const usedStepsLastWeek=lastResult==='cut_steps_increase';
    if(hasStepHistory&&!usedStepsLastWeek){
      const newStepTarget=(profile.step_target||8000)+1000;
      result='cut_lever_choice';
      msg=lMsg;
      checkinData._leverChoice=true;
      checkinData._newStepTarget=newStepTarget;
      // Show choice screen
      setCI(98,`<h1 class="page-title">Time to pull a lever 🎯</h1><p class="page-subtitle">${lMsg}</p><p class="page-subtitle" style="margin-bottom:24px;">You have two options. Pick one:</p><button class="btn btn-choice" onclick="chooseLever('calories')">✂️ Drop my calories by 100<small>From ${profile.current_calories} kcal → ${profile.current_calories-100} kcal</small></button><button class="btn btn-choice" onclick="chooseLever('steps')">👟 Increase my step target by 1,000<small>From ${(profile.step_target||8000).toLocaleString()} → ${newStepTarget.toLocaleString()} steps/day</small></button>`);
    }else{
      newCal=Math.max(1200,profile.current_calories-100);
      result='cut_plateau';
      msg=!hasStepHistory?lMsg+' To unlock the step option at future plateaus, track your steps every week.':lMsg+' You used the step option last week — this week we need to drop calories.';
      finishCheckin(cw,cWaist,cSteps,newCal,result,msg);
    }
  };

  if(phase==='cut'){
    // 1200 cal floor logic
    if(profile.current_calories<=1200){
      const nw=(profile.weeks_at_1200||0)+1;
      await db.from('profiles').update({weeks_at_1200:nw}).eq('user_id',currentUser.id);
      profile.weeks_at_1200=nw;
      if(nw>=4){
        newCal=1300;
        await db.from('profiles').update({current_phase:'reverse',weeks_at_1200:0,current_calories:newCal,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);
        profile.current_phase='reverse';profile.current_calories=newCal;
        result='force_reverse';msg="Your body has been working hard enough. Time to reverse diet — calories increased and your phase has been updated. Trust the process!";
        await saveCI({weight:cw,waist:cWaist,steps_this_week:cSteps,is_outlier:false,calories_before:profile.current_calories,calories_after:newCal,result,result_message:msg});
        if(profile.goal_weight&&cw<=profile.goal_weight){await db.from('profiles').update({goal_weight:null,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);profile.goal_weight=null;showGoalReached(newCal);return;}
        showResult({type:result,newCal,oldCal:profile.current_calories,msg});return;
      }
      result='cut_at_1200';msg="You're currently on our minimum calorie plan of 1,200 calories. We never go below this — it's non-negotiable for your health. Keep checking in each week and we'll move you into a reverse diet when the time is right.";
      finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
    }

    // Scale down → hold always, waist irrelevant
    if(scaleDiff<0){
      result='cut_losing';msg="Scale's moving — stay exactly where you are. Your body is doing its thing.";
      finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
    }

    // Scale up — check if second consecutive week
    if(scaleDiff>0){
      const prevScaleDiff=prev.length>=2?(prev[0].weight-prev[1].weight):null;
      const twoWeeksUp=prevScaleDiff!==null&&prevScaleDiff>0;
      if(!twoWeeksUp){
        result='cut_scale_up_w1';msg="Your weight is up this week — before we make any changes, let's see if this is a trend. Hold your calories, stay consistent, and we'll reassess next week.";
        finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
      }
      // Two weeks up — waist decides
      if(waistDiff!==null){
        if(waistDiff>1){
          result='cut_recomp_up';msg="Your weight has been up two weeks in a row, but your waist has decreased by more than 1cm — that tells a different story. Your body is building muscle and losing fat around your midsection. This is a genuine win. Hold your calories and keep going.";
          finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
        }else{
          pullLever("Your weight has been up for two consecutive weeks. Time to adjust.");return;
        }
      }else{
        pullLever("Your weight has been up for two consecutive weeks. Time to adjust.");return;
      }
    }

    // Scale same — check if second consecutive week
    if(scaleDiff===0||Math.abs(scaleDiff)<0.1){
      const prevScaleDiff=prev.length>=2?Math.abs(prev[0].weight-prev[1].weight):null;
      const twoWeeksSame=prevScaleDiff!==null&&prevScaleDiff<0.1;
      if(!twoWeeksSame){
        result='cut_hold_1week';msg="Not to worry — we can only detect a true plateau after two weeks. Stay the course and if you don't drop weight next week we'll adjust accordingly!";
        finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
      }
      // Two weeks same — waist decides
      if(waistDiff!==null){
        if(waistDiff>1){
          result='cut_recomp';msg="Your scale hasn't moved, but your waist is down more than 1cm — and that's the real story. Your body is recomposing: losing fat and building shape at the same time. This is a win. Stay at the same calories and keep going.";
          finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
        }else if(waistDiff>0&&waistDiff<=1){
          pullLever("Your scale has been steady for two weeks and your waist has only moved slightly. Time to add some stimulus.");return;
        }else if(waistDiff<=0){
          // Waist up or same
          if(waistDiff<0){
            result='cut_waist_up_hold';msg="Your scale has been steady and your waist is slightly up this week — this is most likely hormonal, gut-related, or a measurement inconsistency rather than true fat gain. Hold your calories, remeasure under the same conditions next week, and we'll reassess with fresh data.";
            finishCheckin(cw,cWaist,cSteps,newCal,result,msg);return;
          }else{
            pullLever("Your scale has been steady for two weeks. Time to add some stimulus.");return;
          }
        }
      }else{
        pullLever("Your scale has been steady for two weeks. Time to add some stimulus.");return;
      }
    }

  }else if(phase==='reverse'){
    const pct=((cw-pw)/pw)*100;
    if(pct<=0.3){newCal=profile.current_calories+100;result='reverse_healthy';msg="This is exactly how it's supposed to go. Adding 100 calories — your metabolism is loving this.";}
    else{newCal=Math.max(1200,profile.current_calories-50);result='reverse_fast';msg='Slow and steady wins the race here. Pulling back 50 calories to keep things smooth.';}
    finishCheckin(cw,cWaist,cSteps,newCal,result,msg);
  }else if(phase==='maintain'){
    let anchor=profile.maintenance_anchor_weight;
    if(!anchor){anchor=cw;await db.from('profiles').update({maintenance_anchor_weight:anchor}).eq('user_id',currentUser.id);}
    const diff=cw-anchor;
    if(Math.abs(diff)<=0.75){result='maintain_stable';msg="Your weight is perfectly stable this week. *chef's kiss!* Keep your calories exactly as they are!";}
    else if(diff<-0.75){newCal=profile.current_calories+50;result='maintain_low';msg="Your weight has drifted a little low — adding 50 calories to bring you back to your happy place.";}
    else{newCal=Math.max(1200,profile.current_calories-50);result='maintain_high';msg="Your weight has nudged a little high — dropping 50 calories to rebalance. No stress, this is totally normal.";}
    finishCheckin(cw,cWaist,cSteps,newCal,result,msg);
  }else if(phase==='build'){
    const pct=((cw-pw)/pw)*100;
    if(pct<0.3){newCal=profile.current_calories+100;result='build_slow';msg='We need to feed the machine! Adding 100 calories to get your build moving.';}
    else if(pct<=0.5){result='build_perfect';msg='This is the sweet spot right here. Stay exactly where you are — your body is responding perfectly.';}
    else{if(checkinData.discomfort){newCal=Math.max(1200,profile.current_calories-100);result='build_fast_discomfort';msg="Let's slow down that gain and make your digestion a little more comfortable! Pulling back 100 calories.";}else{newCal=Math.max(1200,profile.current_calories-50);result='build_fast';msg='Gaining a little faster than ideal. Pulling back 50 calories to slow the rate of gain.';}}
    finishCheckin(cw,cWaist,cSteps,newCal,result,msg);
  }
}

async function chooseLever(choice){
  const cw=checkinData.weight,cWaist=checkinData.waist||null,cSteps=checkinData.steps_this_week||null;
  let newCal=profile.current_calories,result='',msg='';
  if(choice==='calories'){
    newCal=Math.max(1200,profile.current_calories-100);
    result='cut_plateau';msg="Dropping calories by 100 to get things moving again.";
  }else{
    const newStepTarget=checkinData._newStepTarget||(profile.step_target+1000);
    await db.from('profiles').update({step_target:newStepTarget,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);
    profile.step_target=newStepTarget;
    result='cut_steps_increase';
    msg=`Step target increased to ${newStepTarget.toLocaleString()} steps/day. Hit that target consistently this week — if the scale still hasn't moved next check-in, we'll drop calories.`;
  }
  finishCheckin(cw,cWaist,cSteps,newCal,result,msg);
}

async function finishCheckin(cw,cWaist,cSteps,newCal,result,msg){
  await saveCI({weight:cw,waist:cWaist,steps_this_week:cSteps,is_outlier:false,calories_before:profile.current_calories,calories_after:newCal,result,result_message:msg});
  const bwDiff=Math.abs(cw-profile.macro_bodyweight);
  let updatedFields={updated_at:new Date().toISOString()};
  if(newCal!==profile.current_calories){updatedFields.current_calories=newCal;profile.current_calories=newCal;}
  if(bwDiff>=5){updatedFields.macro_bodyweight=cw;profile.macro_bodyweight=cw;}
  if(Object.keys(updatedFields).length>1)await db.from('profiles').update(updatedFields).eq('user_id',currentUser.id);
  if(profile.current_phase==='cut'&&profile.goal_weight&&cw<=profile.goal_weight){
    await db.from('profiles').update({goal_weight:null,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);
    profile.goal_weight=null;showGoalReached(newCal);return;
  }
  showResult({type:result,newCal,oldCal:profile.current_calories,msg});
}

async function saveCI(data){const bw=profile.macro_bodyweight||data.weight||60;const m=calcMacros(data.calories_after||profile.current_calories,bw,profile.current_phase);await db.from('checkins').insert({user_id:currentUser.id,phase:profile.current_phase,created_at:new Date().toISOString(),protein:m.protein,fats:m.fats,carbs:m.carbs,...data});}
async function flagAdmin(type,details){await db.from('admin_flags').insert({user_id:currentUser.id,name:profile.name,email:profile.email,flag_type:type,details,created_at:new Date().toISOString()});}
function showResult({type,newCal,oldCal,msg}){
  const macros=calcMacros(newCal,profile.macro_bodyweight,profile.current_phase);
  const diff=newCal-oldCal;
  const diffStr=diff>0?`+${diff} calories`:diff<0?`${diff} calories`:null;
  const titles={
    cut_losing:'Scale is moving! 🔥',cut_plateau:'Dropping calories 📉',cut_recomp:'Body recomposition win! 💪',
    cut_recomp_up:'Recomposition happening! 💪',cut_scale_up_w1:'Holding steady this week',
    cut_waist_up_hold:'Hold and remeasure 📏',cut_steps_increase:'Step target increased! 👟',
    cut_lever_choice:'Lever pulled!',cut_at_1200:'Holding at 1,200 calories',
    cut_hold_1week:'Holding steady',force_reverse:'Time to reverse diet 💗',
    reverse_healthy:'Healthy progress!',reverse_fast:"Let's slow it down",
    maintain_stable:'Perfectly stable!',maintain_low:"Let's bring you back up",maintain_high:"Let's rebalance",
    build_slow:"Let's feed the machine!",build_perfect:'Sweet spot!',
    build_fast:"Let's dial it in",build_fast_discomfort:'Giving your body some relief',
    hold_outlier:'Holding steady this week',hold_non_adherent:'Holding steady this week',
    first_checkin:'First check-in logged! 🎯',second_checkin:'Good data coming in!'
  };
  const stepTarget=type==='cut_steps_increase'&&profile.step_target?`<div class="cal-display" style="border-color:var(--green);margin-bottom:24px;"><div class="cal-label">New Step Target</div><div class="cal-number" style="color:var(--green)">${profile.step_target.toLocaleString()}</div><div class="cal-unit">steps per day</div></div>`:'';
  document.getElementById('result-content').innerHTML=`<div class="result-box"><div class="result-icon">🎯</div><h2 class="result-title">${titles[type]||'Your result'}</h2></div>${stepTarget}<div class="cal-display"><div class="cal-label">${diff!==0?'New daily calories':'Your daily calories'}</div><div class="cal-number">${newCal}</div><div class="cal-unit">kcal / day</div>${diffStr?`<div class="cal-change">${diffStr}</div>`:''}</div><div class="macros-grid"><div class="macro-card"><div class="macro-val">${macros.protein}g</div><div class="macro-lbl">Protein</div></div><div class="macro-card"><div class="macro-val">${macros.fats}g</div><div class="macro-lbl">Fats</div></div><div class="macro-card"><div class="macro-val">${macros.carbs}g</div><div class="macro-lbl">Carbs</div></div></div><div class="result-box" style="border-left-color:var(--orange2);"><p style="font-size:16px;color:var(--mid);line-height:1.6;">${msg}</p></div><p class="end-msg">Check again next week ✓</p><button class="btn btn-primary mt-24" onclick="loadDashboard()">Back to my Compass</button>`;
  showScreen('screen-result');
}

function showGoalReached(cal){const macros=calcMacros(cal,profile.macro_bodyweight,profile.current_phase);document.getElementById('result-content').innerHTML=`<div style="text-align:center;padding:32px 0 16px;"><div style="font-size:64px;margin-bottom:16px;">🎉</div><h2 style="font-size:28px;font-weight:800;color:var(--orange);margin-bottom:8px;">YOU DID IT!</h2><p style="font-size:17px;color:var(--mid);line-height:1.6;margin-bottom:24px;">You've reached your goal weight! This is a huge deal — be proud of yourself. Your goal has been cleared and it's time to decide your next chapter.</p></div><div class="cal-display"><div class="cal-label">Your daily calories</div><div class="cal-number">${cal}</div><div class="cal-unit">kcal / day</div></div><div class="macros-grid"><div class="macro-card"><div class="macro-val">${macros.protein}g</div><div class="macro-lbl">Protein</div></div><div class="macro-card"><div class="macro-val">${macros.fats}g</div><div class="macro-lbl">Fats</div></div><div class="macro-card"><div class="macro-val">${macros.carbs}g</div><div class="macro-lbl">Carbs</div></div></div><button class="btn btn-primary mt-24" onclick="loadDashboard()">What's next? →</button>`;showScreen('screen-result');}

function calcMacros(cal,bw,phase){const proteinRate=cal<1400?1.8:2.0;const sex=profile?profile.biological_sex:'prefer_not_to_say';const proteinCap=sex==='male'?220:200;const protein=Math.min(proteinCap,Math.round(bw*proteinRate));const fatsTarget=Math.round(bw*(phase==='cut'?0.7:1.0));const fatsMin=Math.max(40,Math.round(bw*0.5));const carbsMin=50;let fats=fatsTarget;let remain=cal-(protein*4)-(fats*9);if(remain/4<carbsMin){fats=Math.max(fatsMin,Math.floor((cal-(protein*4)-(carbsMin*4))/9));remain=cal-(protein*4)-(fats*9);}const carbs=Math.round(Math.max(0,remain)/4/5)*5;return{protein,fats,carbs};}

async function loadHistory(){document.getElementById('tab-history').innerHTML=`<div class="spinner-wrap"><div class="spinner"></div></div>`;const{data}=await db.from('checkins').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(24);if(!data?.length){document.getElementById('tab-history').innerHTML=`<p class="text-mid">No check-ins yet. Complete your first check-in to start building your history.</p>`;return;}const phaseClass={cut:'badge-cut',reverse:'badge-reverse',maintain:'badge-maintain',build:'badge-build'};const outlierLabel={'Period / hormonal week':'Period','Sick this week':'Sick','High stress or disrupted routine':'Stress','Non-adherent week':'Off plan'};let html='';let lastMonth='';data.filter(r=>!r.deleted).forEach(r=>{const d=new Date(r.created_at);const month=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase();if(month!==lastMonth){if(lastMonth)html+='</div>';html+=`<div class="history-section-label">${month}</div><div class="history-list">`;lastMonth=month;}const day=d.toLocaleDateString('en-GB',{day:'numeric'});const mon=d.toLocaleDateString('en-GB',{month:'short'}).toUpperCase();const weight=r.weight?wLabel(r.weight):'—';const cals=r.calories_after?r.calories_after+' kcal':'—';const macroStr=(r.protein&&r.fats&&r.carbs)?`${r.protein}g P · ${r.fats}g F · ${r.carbs}g C`:'—';const extras=[r.waist?`📏 ${r.waist}cm`:null,r.steps_this_week?`👟 ${r.steps_this_week.toLocaleString()} steps`:null].filter(Boolean).join(' · ');const phaseBadge=r.phase?`<span class="badge ${phaseClass[r.phase]||''}">${r.phase}</span>`:'';const outlierBadge=r.is_outlier&&r.outlier_reason?`<span class="badge badge-outlier">${outlierLabel[r.outlier_reason]||'Outlier'}</span>`:'';html+=`<div class="history-card"><div class="history-date"><div class="history-day">${day}</div><div class="history-month">${mon}</div></div><div class="history-divider"></div><div class="history-body"><div class="history-weight">${weight}</div><div class="history-cals">${cals}</div><div class="history-meta">${macroStr}</div>${extras?`<div class="history-meta">${extras}</div>`:''}</div><div class="history-badge-wrap">${phaseBadge}${outlierBadge}</div><button class="history-delete" onclick="deleteCheckin('${r.id}')">×</button></div>`;});html+='</div>';document.getElementById('tab-history').innerHTML=html;}
async function deleteCheckin(id){if(!confirm('Hide this check-in from your history? Emily can still see it on her end.'))return;await db.from('checkins').update({deleted:true}).eq('id',id).eq('user_id',currentUser.id);loadHistory();}

function loadSettings(){const isLbs=profile.unit_pref==='lbs';const goalVal=profile.goal_weight?fromKg(profile.goal_weight):'';document.getElementById('tab-settings').innerHTML=`<div class="settings-title">Your Settings</div><div class="settings-sub">Manage your preferences below.</div><div class="settings-section"><div class="settings-section-title">Profile</div><div class="settings-card"><div class="field" style="margin-bottom:0"><label>First name</label><input type="text" id="set-name" value="${profile.name||''}" /></div></div></div><div class="settings-section"><div class="settings-section-title">Weight units</div><div class="settings-card"><div class="unit-row"><button id="unit-kg" class="unit-btn ${!isLbs?'selected':''}" onclick="selectUnit('kg')">kg</button><button id="unit-lbs" class="unit-btn ${isLbs?'selected':''}" onclick="selectUnit('lbs')">lbs</button></div></div></div><div class="settings-section"><div class="settings-section-title">Step Target</div><div class="settings-card"><div class="field" style="margin-bottom:4px;"><label>Daily step target</label><input type="number" id="set-steps" value="${profile.step_target||''}" placeholder="e.g. 8000" min="1000" max="50000" /></div><div class="goal-hint">Your step target is used as a lever at plateaus — keeping it up to date gives you more options.</div></div></div>${profile.current_phase==='cut'?`<div class="settings-section"><div class="settings-section-title">Goal weight <span style="font-size:10px;color:var(--orange);font-weight:700;margin-left:4px;">CUT PHASE</span></div><div class="settings-card"><div class="field" style="margin-bottom:4px;"><label>Goal weight (${getUnit()})</label><input type="number" id="set-goal" value="${goalVal}" step="0.1" placeholder="${isLbs?'e.g. 130':'e.g. 59'}" min="${isLbs?88:40}" max="${isLbs?440:200}" /></div><div class="goal-hint">Shows your progress bar on the dashboard.</div></div></div>`:''}<button class="btn btn-primary mt-16" onclick="saveSettings()">Save changes</button><div id="set-msg" class="msg"></div>`;}
function selectUnit(u){profile.unit_pref=u;document.querySelectorAll('.unit-btn').forEach(el=>el.classList.remove('selected'));document.getElementById('unit-'+u).classList.add('selected');}
async function saveSettings(){const name=document.getElementById('set-name').value.trim();const unit=profile.unit_pref||'kg';const stepsRaw=parseInt(document.getElementById('set-steps')?.value);const goalRaw=document.getElementById('set-goal')?parseFloat(document.getElementById('set-goal').value):null;const goalKg=goalRaw?toKg(goalRaw):null;const updates={name,unit_pref:unit,updated_at:new Date().toISOString()};if(stepsRaw&&stepsRaw>0)updates.step_target=stepsRaw;if(goalKg)updates.goal_weight=goalKg;const{error}=await db.from('profiles').update(updates).eq('user_id',currentUser.id);if(!error){profile.name=name;profile.unit_pref=unit;if(stepsRaw)profile.step_target=stepsRaw;if(goalKg)profile.goal_weight=goalKg;showMsg('set-msg','Saved ✓','success');renderHome();}else showMsg('set-msg','Error saving — please try again.','error');}

async function loadAdminDashboard(){showScreen('screen-admin');const{data:clients}=await db.from('profiles').select('*').neq('email',ADMIN_EMAIL).order('updated_at',{ascending:false});const pL={cut:'Cut',reverse:'Reverse',maintain:'Maintain',build:'Build'};const pC={cut:'badge-cut',reverse:'badge-reverse',maintain:'badge-maintain',build:'badge-build'};document.getElementById('admin-clients').innerHTML=clients?.length?`<p class="text-mid" style="margin-bottom:16px;">${clients.length} clients</p>${clients.map(c=>`<div class="client-row" onclick="viewClient('${c.user_id}')"><div><div class="client-name">${c.name||c.email}</div><div class="client-meta"><span class="badge ${pC[c.current_phase]||''}" style="margin-right:6px;">${pL[c.current_phase]||'—'}</span>${c.current_calories} kcal · BW ${c.macro_bodyweight}kg${c.step_target?` · 👟 ${c.step_target.toLocaleString()}`:''}</div></div><span style="color:var(--mid)">→</span></div>`).join('')}`:'<p class="text-mid">No clients yet.</p>';const{data:flags}=await db.from('admin_flags').select('*').order('created_at',{ascending:false}).limit(30);document.getElementById('admin-flags').innerHTML=flags?.length?flags.map(f=>`<div style="padding:16px 0;border-bottom:1px solid var(--pink-bg);"><div style="font-weight:600;font-size:15px;">${f.name||f.email}</div><div class="text-mid">${f.flag_type} · ${new Date(f.created_at).toLocaleDateString('en-GB')}</div><div class="text-mid mt-8" style="font-size:13px;">${JSON.stringify(f.details)}</div></div>`).join(''):'<p class="text-mid">No flags.</p>';}
async function viewClient(uid){const{data:c}=await db.from('profiles').select('*').eq('user_id',uid).single();if(!c)return;const pL={cut:'Cut',reverse:'Reverse Diet',maintain:'Maintenance',build:'Build'};document.getElementById('admin-clients').innerHTML=`<button class="btn-back show" onclick="loadAdminDashboard()">← All clients</button><h2 style="font-size:22px;font-weight:700;margin-bottom:4px;">${c.name||c.email}</h2><p class="text-mid" style="margin-bottom:24px;">${c.email}</p><div class="field"><label>Phase</label><select id="ac-phase">${['cut','reverse','maintain','build'].map(p=>`<option value="${p}"${c.current_phase===p?' selected':''}>${pL[p]}</option>`).join('')}</select></div><div class="field"><label>Current calories</label><input type="number" id="ac-cal" value="${c.current_calories}" /></div><div class="field"><label>Macro bodyweight (kg)</label><input type="number" id="ac-bw" value="${c.macro_bodyweight}" step="0.1" /></div><div class="field"><label>Step target</label><input type="number" id="ac-steps" value="${c.step_target||''}" placeholder="e.g. 8000" /></div><div class="field"><label>Internal notes</label><input type="text" id="ac-notes" value="${c.notes||''}" placeholder="Notes visible to you only…" /></div><button class="btn btn-primary" onclick="saveClient('${uid}')">Save changes</button><div id="ac-msg" class="msg"></div>`;}
async function saveClient(uid){const stepsVal=parseInt(document.getElementById('ac-steps')?.value)||null;const{error}=await db.from('profiles').update({current_phase:document.getElementById('ac-phase').value,current_calories:parseInt(document.getElementById('ac-cal').value),macro_bodyweight:parseFloat(document.getElementById('ac-bw').value),step_target:stepsVal,notes:document.getElementById('ac-notes').value,updated_at:new Date().toISOString()}).eq('user_id',uid);showMsg('ac-msg',error?'Error saving.':'Saved ✓',error?'error':'success');}

function showMsg(id,txt,type){const el=document.getElementById(id);if(!el)return;el.textContent=txt;el.className=`msg msg-${type} show`;setTimeout(()=>el.classList.remove('show'),4000);}

(async()=>{const{data:{session}}=await db.auth.getSession();if(session?.user){currentUser=session.user;await loadProfile();}else showScreen('screen-auth');})();
</script>
</body>
