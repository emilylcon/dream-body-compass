<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Body Compass</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange:#FF5501; --orange2:#FF8529; --lavender:#DEADF6;
      --pink-bg:#FFD2F0; --cream:#FDF1E6; --dark:#333333;
      --mid:#666666; --white:#FFFFFF; --green:#10B981;
    }
    body { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; background:linear-gradient(135deg,#FDF1E6 0%,#FFD2F0 100%); min-height:100vh; color:var(--dark); font-size:16px; line-height:1.5; padding:24px 16px 48px; }
    .container { max-width:600px; margin:0 auto; background:var(--white); border-radius:24px; box-shadow:0 20px 60px rgba(255,85,1,0.15); overflow:hidden; animation:fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .top-bar { background:linear-gradient(90deg,#FF5501 0%,#FF8529 100%); padding:20px 40px; display:flex; align-items:center; justify-content:space-between; border-radius:24px 24px 0 0; }
    .brand-title { font-size:20px; font-weight:700; color:white; }
    .brand-tagline { font-size:12px; color:rgba(255,255,255,0.8); margin-top:2px; }
    .top-signout { font-size:12px; color:rgba(255,255,255,0.8); cursor:pointer; border:none; background:none; font-family:inherit; }
    .top-signout:hover { color:white; }
    .card-body { padding:48px; }
    @media(max-width:600px){ .card-body{padding:32px 24px} .top-bar{padding:18px 24px} }
    .screen { display:none; }
    .screen.active { display:block; }
    .progress-wrap { width:100%; height:8px; background:var(--pink-bg); border-radius:10px; margin-bottom:32px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#FF5501 0%,#FF8529 100%); border-radius:10px; transition:width 0.4s ease; }
    .page-title { font-size:32px; font-weight:700; color:var(--orange); margin-bottom:8px; line-height:1.2; }
    .page-subtitle { font-size:16px; color:var(--mid); margin-bottom:32px; line-height:1.5; }
    @media(max-width:600px){ .page-title{font-size:24px} }
    .btn { display:block; width:100%; padding:20px 24px; border-radius:16px; font-size:18px; font-weight:500; cursor:pointer; transition:all 0.3s ease; text-align:left; font-family:inherit; line-height:1.3; text-decoration:none; }
    .btn-choice { background:var(--white); border:2px solid var(--lavender); color:var(--dark); margin-bottom:16px; }
    .btn-choice:hover,.btn-choice.selected { background:var(--cream); border-color:var(--orange2); transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,85,1,0.2); }
    .btn-choice small { display:block; font-size:14px; color:var(--mid); margin-top:3px; font-weight:400; }
    .btn-primary { background:linear-gradient(135deg,#FF5501 0%,#FF8529 100%); border:none; color:var(--white); text-align:center; margin-bottom:16px; }
    .btn-primary:hover { box-shadow:0 6px 20px rgba(255,85,1,0.3); transform:translateY(-1px); }
    .btn-action { background:var(--white); border:2px solid var(--orange); color:var(--orange); border-radius:12px; padding:16px 32px; text-align:center; font-size:16px; margin-bottom:12px; display:block; width:100%; cursor:pointer; font-family:inherit; font-weight:500; transition:all 0.3s ease; }
    .btn-action:hover { background:var(--cream); }
    .btn-back { background:none; border:none; color:var(--mid); font-size:14px; font-family:inherit; cursor:pointer; padding:8px 0; margin-bottom:24px; display:none; }
    .btn-back:hover { color:var(--orange); }
    .btn-back.show { display:block; }
    .btn-ghost { background:none; border:none; color:var(--mid); font-size:14px; font-family:inherit; cursor:pointer; padding:8px 0; display:block; text-align:center; width:100%; margin-top:8px; }
    .btn-ghost:hover { color:var(--orange); }
    .field { margin-bottom:20px; }
    label { display:block; font-size:14px; color:var(--mid); margin-bottom:6px; }
    input[type="email"],input[type="password"],input[type="number"],input[type="text"],select { width:100%; padding:12px; border:2px solid var(--lavender); border-radius:8px; font-size:16px; font-family:inherit; color:var(--dark); background:var(--white); outline:none; transition:border-color 0.2s; }
    input:focus,select:focus { border-color:var(--orange); }
    .result-box { background:var(--cream); padding:24px; border-radius:16px; border-left:4px solid var(--orange); margin-bottom:24px; }
    .result-title { font-size:28px; font-weight:700; color:var(--dark); margin-bottom:4px; }
    .result-icon { font-size:32px; margin-bottom:8px; }
    .cal-display { background:var(--cream); border-radius:16px; padding:24px; text-align:center; margin-bottom:24px; border:2px solid var(--orange); }
    .cal-label { font-size:14px; color:var(--mid); margin-bottom:4px; }
    .cal-number { font-size:48px; font-weight:700; color:var(--orange); line-height:1; }
    .cal-unit { font-size:16px; color:var(--mid); margin-top:2px; }
    .cal-change { font-size:14px; color:var(--orange2); font-weight:500; margin-top:4px; }
    .macros-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:24px; }
    .macro-card { background:var(--cream); border-radius:12px; padding:16px 12px; text-align:center; }
    .macro-val { font-size:22px; font-weight:700; color:var(--dark); }
    .macro-lbl { font-size:12px; color:var(--mid); margin-top:2px; }
    .warning-box { background:rgba(255,85,1,0.06); border:2px solid rgba(255,85,1,0.25); border-radius:16px; padding:20px; margin-bottom:24px; }
    .warning-box h4 { font-size:18px; font-weight:700; color:var(--orange); margin-bottom:8px; }
    .warning-box p { font-size:15px; color:var(--dark); line-height:1.5; }
    .info-box { background:rgba(222,173,246,0.15); border:1.5px solid rgba(222,173,246,0.5); border-radius:12px; padding:14px 16px; margin-top:8px; font-size:13px; color:var(--mid); line-height:1.5; }
    .info-box strong { color:var(--dark); }
    .msg { font-size:14px; padding:12px 16px; border-radius:8px; margin-top:12px; display:none; }
    .msg.show { display:block; }
    .msg-error { background:rgba(255,85,1,0.08); color:#c0392b; }
    .msg-success { background:rgba(16,185,129,0.1); color:var(--green); }
    .nav-tabs { display:flex; background:white; border-radius:20px; padding:6px; gap:4px; margin-bottom:28px; box-shadow:0 2px 16px rgba(255,85,1,0.08); }
    .nav-tab { flex:1; padding:10px 8px; border-radius:14px; font-size:13px; font-weight:600; color:var(--mid); background:none; border:none; cursor:pointer; font-family:inherit; text-align:center; transition:all 0.2s; }
    .nav-tab:hover { color:var(--dark); }
    .nav-tab.active { background:linear-gradient(135deg,#FF5501,#FF8529); color:white; box-shadow:0 4px 12px rgba(255,85,1,0.3); }
    .history-list { display:flex; flex-direction:column; gap:10px; }
    .history-section-label { font-size:11px; font-weight:700; color:var(--mid); letter-spacing:0.08em; text-transform:uppercase; margin:20px 0 10px 4px; }
    .history-card { background:white; border-radius:16px; padding:16px 18px; box-shadow:0 2px 12px rgba(255,85,1,0.07); border:1.5px solid rgba(255,85,1,0.05); display:flex; align-items:center; gap:14px; position:relative; overflow:visible; }
    .history-date { min-width:42px; text-align:center; }
    .history-day { font-family:'Clash Display',sans-serif; font-size:22px; font-weight:700; color:var(--dark); line-height:1; }
    .history-month { font-size:11px; color:var(--mid); font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
    .history-divider { width:1.5px; height:40px; background:var(--pink-bg); flex-shrink:0; }
    .history-body { flex:1; min-width:0; }
    .history-weight { font-family:'Clash Display',sans-serif; font-size:18px; font-weight:700; color:var(--dark); }
    .history-cals { font-size:13px; color:var(--orange); font-weight:700; margin-top:1px; }
    .history-meta { font-size:12px; color:var(--mid); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-badge-wrap { display:flex; flex-direction:row; align-items:center; gap:5px; flex-shrink:0; align-self:center; }
    .history-delete { width:22px; height:22px; border-radius:50%; background:#E8D5F5; border:none; color:#9B7BB8; cursor:pointer; font-size:12px; line-height:1; position:absolute; top:-8px; right:-8px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:all 0.2s; }
    .history-delete:hover { background:var(--orange); color:white; transform:scale(1.1); }
    .badge { display:inline-block; font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; }
    .badge-cut { background:rgba(255,85,1,0.1); color:var(--orange); }
    .badge-reverse { background:rgba(222,173,246,0.3); color:#7c3aed; }
    .badge-maintain { background:rgba(16,185,129,0.1); color:var(--green); }
    .badge-build { background:rgba(51,51,51,0.08); color:var(--dark); }
    .badge-outlier { background:var(--pink-bg); color:var(--mid); }
    .client-row { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--pink-bg); cursor:pointer; transition:opacity 0.2s; }
    .client-row:hover { opacity:0.7; }
    .client-row:last-child { border-bottom:none; }
    .client-name { font-weight:600; font-size:15px; }
    .client-meta { font-size:13px; color:var(--mid); margin-top:4px; }
    .admin-label { font-size:11px; background:rgba(255,85,1,0.1); color:var(--orange); padding:3px 10px; border-radius:20px; font-weight:600; margin-left:8px; }
    .checklist { list-style:none; margin:20px 0; }
    .checklist li { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--pink-bg); font-size:15px; }
    .checklist li:last-child { border-bottom:none; }
    .check-mark { color:var(--green); font-size:16px; flex-shrink:0; margin-top:1px; }
    .text-mid { color:var(--mid); font-size:14px; }
    .text-center { text-align:center; }
    .mt-8{margin-top:8px} .mt-16{margin-top:16px} .mt-24{margin-top:24px} .mt-32{margin-top:32px}
    .end-msg { text-align:center; font-size:16px; color:var(--mid); margin-top:8px; }
    .spinner-wrap { text-align:center; padding:40px 0; }
    .spinner { width:28px; height:28px; border:3px solid var(--pink-bg); border-top-color:var(--orange); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .dash-greeting { margin-bottom:20px; }
    .dash-greeting h1 { font-family:'Clash Display',sans-serif; font-size:28px; font-weight:700; color:var(--dark); line-height:1.2; }
    .dash-greeting p { font-size:14px; color:var(--mid); margin-top:4px; }
    .dash-phase-badge { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:30px; font-size:13px; font-weight:700; background:rgba(255,85,1,0.1); color:var(--orange); border:1.5px solid rgba(255,85,1,0.2); margin-bottom:20px; }
    .dash-phase-dot { width:8px; height:8px; border-radius:50%; background:var(--orange); animation:pulseDot 2s infinite; display:inline-block; }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }
    .dash-cal-hero { background:linear-gradient(135deg,#FF5501 0%,#FF8529 100%); border-radius:24px; padding:28px 24px; margin-bottom:16px; position:relative; overflow:hidden; box-shadow:0 12px 40px rgba(255,85,1,0.35); }
    .dash-cal-hero::before { content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,0.08); }
    .dash-cal-hero::after { content:''; position:absolute; bottom:-30px; left:20px; width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,0.05); }
    .dash-cal-label { font-size:12px; color:rgba(255,255,255,0.75); font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:4px; }
    .dash-cal-number { font-family:'Clash Display',sans-serif; font-size:64px; font-weight:700; color:white; line-height:1; }
    .dash-cal-unit { font-size:18px; color:rgba(255,255,255,0.8); font-weight:500; margin-top:2px; }
    .dash-macro-wrap { background:white; border-radius:18px; padding:20px; display:flex; align-items:center; gap:24px; box-shadow:0 2px 16px rgba(255,85,1,0.08); border:1.5px solid rgba(255,85,1,0.06); margin-bottom:16px; }
    .dash-donut-wrap { width:110px; flex-shrink:0; }
    .dash-donut-svg { width:100%; height:auto; }
    .dash-macro-list { flex:1; display:flex; flex-direction:column; gap:12px; }
    .dash-macro-row { display:flex; align-items:center; gap:10px; }
    .dash-macro-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .dash-macro-name { font-size:13px; color:var(--mid); font-weight:600; flex:1; }
    .dash-macro-pct { font-size:11px; color:#B0B8C1; font-weight:500; margin-left:3px; }
    .dash-macro-val { font-family:'Clash Display',sans-serif; font-size:18px; font-weight:700; color:var(--dark); }
    .dash-stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
    .dash-stat-card { background:white; border-radius:18px; padding:18px 16px; box-shadow:0 2px 16px rgba(255,85,1,0.08); border:1.5px solid rgba(255,85,1,0.06); }
    .dash-stat-label { font-size:11px; color:var(--mid); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px; }
    .dash-stat-value { font-family:'Clash Display',sans-serif; font-size:22px; font-weight:700; color:var(--dark); }
    .dash-goal-card { background:white; border-radius:18px; padding:18px 20px; margin-bottom:16px; box-shadow:0 2px 16px rgba(255,85,1,0.08); border:1.5px solid rgba(255,85,1,0.06); }
    .dash-fade { animation:dashFadeUp 0.4s ease both; }
    @keyframes dashFadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .settings-section { margin-bottom:20px; }
    .settings-section-title { font-size:11px; font-weight:700; color:var(--mid); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; padding:0 2px; }
    .settings-card { background:white; border-radius:18px; padding:20px; box-shadow:0 2px 16px rgba(255,85,1,0.08); border:1.5px solid rgba(255,85,1,0.06); }
    .unit-row { display:flex; gap:10px; }
    .unit-btn { flex:1; padding:14px; border-radius:12px; font-size:15px; font-weight:700; border:2px solid var(--lavender); background:white; color:var(--mid); cursor:pointer; font-family:inherit; text-align:center; transition:all 0.2s; }
    .unit-btn.selected { background:linear-gradient(135deg,#FF5501,#FF8529); color:white; border-color:transparent; box-shadow:0 4px 12px rgba(255,85,1,0.3); }
    .settings-title { font-family:'Clash Display',sans-serif; font-size:26px; font-weight:700; color:var(--dark); margin-bottom:4px; }
    .settings-sub { font-size:14px; color:var(--mid); margin-bottom:24px; }
    .goal-hint { font-size:12px; color:var(--mid); margin-top:6px; line-height:1.5; }
    .step-guide { display:flex; flex-direction:column; gap:10px; margin:16px 0; }
    .step-guide-btn { background:var(--white); border:2px solid var(--lavender); border-radius:12px; padding:14px 16px; cursor:pointer; font-family:inherit; font-size:15px; font-weight:600; color:var(--dark); text-align:left; transition:all 0.2s; }
    .step-guide-btn:hover { border-color:var(--orange2); background:var(--cream); }
    .step-guide-btn small { display:block; font-size:12px; color:var(--mid); font-weight:400; margin-top:2px; }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="top-bar">
    <div>
      <div class="brand-title">🧭 Dream Body Compass</div>
      <div class="brand-tagline">Personalised calorie guidance in under 2 minutes</div>
    </div>
    <button class="top-signout" id="top-signout" style="display:none" onclick="signOut()">Sign out</button>
  </div>
  <div class="card-body screen active" id="screen-auth">
    <h1 class="page-title">Welcome back 👋</h1>
    <p class="page-subtitle">Sign in to access your weekly check-in and calorie guidance.</p>
    <div class="field"><label>Email</label><input type="email" id="auth-email" autocomplete="email" placeholder="your@email.com" /></div>
    <div class="field"><label>Password</label><input type="password" id="auth-password" autocomplete="current-password" placeholder="••••••••" /></div>
    <div id="auth-error" class="msg msg-error"></div>
    <div id="auth-success" class="msg msg-success"></div>
    <button class="btn btn-primary mt-16" onclick="signInWithEmail()">Sign In</button>
    <button class="btn-action" onclick="signUpWithEmail()">Create Account</button>
    <button class="btn-ghost" onclick="showForgotPassword()">Forgot password?</button>
    <div id="forgot-wrap" style="display:none;margin-top:16px;">
      <div class="field"><label>Enter your email</label><input type="email" id="forgot-email" placeholder="your@email.com" /></div>
      <button class="btn btn-primary mt-8" onclick="sendPasswordReset()">Send reset email</button>
      <div id="forgot-msg" class="msg"></div>
    </div>
    <p class="text-mid text-center mt-16">For Dream Body Blueprint graduates only.</p>
  </div>
  <div class="card-body screen" id="screen-onboarding">
    <div class="progress-wrap"><div class="progress-fill" id="ob-progress" style="width:0%"></div></div>
    <div id="ob-dots" style="display:flex;gap:6px;margin-bottom:24px;"></div>
    <div id="ob-content"></div>
  </div>
  <div class="card-body screen" id="screen-triage">
    <div class="progress-wrap"><div class="progress-fill" id="triage-progress" style="width:0%"></div></div>
    <div id="triage-content"></div>
  </div>
  <div class="card-body screen" id="screen-dashboard">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showTab('home')">Home</button>
      <button class="nav-tab" onclick="showTab('history')">History</button>
      <button class="nav-tab" onclick="showTab('settings')">Settings</button>
    </div>
    <div id="tab-home"></div>
    <div id="tab-history" style="display:none"></div>
    <div id="tab-settings" style="display:none"></div>
  </div>
  <div class="card-body screen" id="screen-checkin">
    <div class="progress-wrap"><div class="progress-fill" id="ci-progress" style="width:0%"></div></div>
    <div id="ci-content"></div>
  </div>
  <div class="card-body screen" id="screen-result">
    <div id="result-content"></div>
  </div>
  <div class="card-body screen" id="screen-admin">
    <div style="display:flex;align-items:center;margin-bottom:24px;">
      <h1 class="page-title" style="margin:0;">Clients</h1>
      <span class="admin-label">Admin</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showAdminTab('admin-clients')">All Clients</button>
      <button class="nav-tab" onclick="showAdminTab('admin-flags')">🚩 Flags</button>
    </div>
    <div id="admin-clients"></div>
    <div id="admin-flags" style="display:none"></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://mvjnlvmjlekpnqedztdv.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12am5sdm1qbGVrcG5xZWR6dGR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MDU1MjgsImV4cCI6MjA4ODI4MTUyOH0.3TSlhWH4oe8WHRCNI3P3s-U_hp_1JO0Lxke50wdZkBs';
const ADMIN_EMAIL='hello@emilycontarino.com';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{db:{schema:'public'},global:{headers:{'Accept-Profile':'public','Content-Profile':'public'}}});
let currentUser=null,profile=null,checkinData={},triageData={source:'',answers:{}},obData={},obStep=0,checkinRedFlags=[];

function getUnit(){return(profile&&profile.unit_pref==="lbs")?"lbs":"kg"}
function toKg(val){return getUnit()==="lbs"?Math.round(val/2.20462*10)/10:val}
function fromKg(val){return getUnit()==="lbs"?Math.round(val*2.20462*10)/10:val}
function wLabel(val){if(!val)return"—";return fromKg(val)+getUnit()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);document.getElementById('top-signout').style.display=id!=='screen-auth'?'block':'none';}
function showTab(name){['home','history','settings'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===name?'block':'none';});document.querySelectorAll('.nav-tab').forEach((el,i)=>{el.classList.toggle('active',['home','history','settings'][i]===name);});if(name==='history')loadHistory();if(name==='settings')loadSettings();}
function showAdminTab(name){['admin-clients','admin-flags'].forEach(t=>{document.getElementById(t).style.display=t===name?'block':'none';});document.querySelectorAll('.nav-tab').forEach((el,i)=>{el.classList.toggle('active',['admin-clients','admin-flags'][i]===name);});}

async function signInWithEmail(){const email=document.getElementById('auth-email').value.trim();const pass=document.getElementById('auth-password').value;if(!email||!pass)return showMsg('auth-error','Please fill in all fields.','error');showMsg('auth-success','Signing in...','success');const{data,error}=await db.auth.signInWithPassword({email,password:pass});if(error){showMsg('auth-error','Incorrect email or password.','error');return;}const user=data?.user||data?.session?.user;if(user){currentUser=user;await loadProfile();}else showMsg('auth-error','Sign in failed. Please try again.','error');}
async function signUpWithEmail(){const email=document.getElementById('auth-email').value.trim();const pass=document.getElementById('auth-password').value;if(!email||!pass)return showMsg('auth-error','Please fill in all fields.','error');if(pass.length<6)return showMsg('auth-error','Password must be at least 6 characters.','error');showMsg('auth-success','Creating your account...','success');const{data,error}=await db.auth.signUp({email,password:pass});if(error){showMsg('auth-error',error.message.includes('already')?'An account with this email already exists. Please sign in instead.':error.message,'error');return;}const user=data?.user||data?.session?.user;if(user){currentUser=user;showMsg('auth-success','Account created! Taking you in...','success');await loadProfile();}else showMsg('auth-success','Account created! Please tap Sign In.','success');}
function showForgotPassword(){const w=document.getElementById('forgot-wrap');w.style.display=w.style.display==='none'?'block':'none';}
async function sendPasswordReset(){const email=document.getElementById('forgot-email').value.trim();if(!email)return showMsg('forgot-msg','Please enter your email.','error');const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});if(error)showMsg('forgot-msg',error.message,'error');else showMsg('forgot-msg','Reset email sent! Check your inbox.','success');}
async function signOut(){await db.auth.signOut();currentUser=null;profile=null;showScreen('screen-auth');}
db.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;profile=null;showScreen('screen-auth');}});
async function loadProfile(){const{data}=await db.from('profiles').select('*').eq('user_id',currentUser.id).single();if(!data)startOnboarding();else{profile=data;if(currentUser.email===ADMIN_EMAIL)loadAdminDashboard();else{await checkAutoTriggers();loadDashboard();}}}

function obShowStepGuide(){
  document.getElementById('ob-step-guide').style.display='block';
  document.getElementById('ob-step-guide').innerHTML=`
    <p style="font-size:14px;color:var(--mid);margin-bottom:12px;">Choose the option that best describes your typical day:</p>
    <div class="step-guide">
      <button class="step-guide-btn" onclick="obSetSteps(6000)">Mostly sedentary<small>Desk job, minimal movement outside of exercise</small></button>
      <button class="step-guide-btn" onclick="obSetSteps(8000)">Lightly active<small>Some walking, on your feet part of the day</small></button>
      <button class="step-guide-btn" onclick="obSetSteps(10000)">Moderately active<small>Regular walking, active job, or consistent daily movement</small></button>
    </div>`;}
function obSetSteps(val){document.getElementById('ob-steps').value=val;document.getElementById('ob-step-guide').style.display='none';}
function obNextSteps(){const s=parseInt(document.getElementById('ob-steps').value);if(!s||s<1000||s>50000){alert('Please enter a valid step count between 1,000 and 50,000.');return;}obNext({step_target:s});}

function startOnboarding(){const saved=localStorage.getItem('ob_'+currentUser.id);if(saved){try{const state=JSON.parse(saved);obStep=state.step||0;obData=state.data||{};}catch(e){obStep=0;obData={};}}else{obStep=0;obData={};}showScreen('screen-onboarding');renderObStep();}
function renderObStep(){const s=obSteps[obStep];document.getElementById('ob-progress').style.width=s.p+'%';document.getElementById('ob-content').innerHTML=s.render();const dotsEl=document.getElementById('ob-dots');if(dotsEl){dotsEl.innerHTML=obSteps.map((_,i)=>`<div style="height:8px;border-radius:4px;background:${i<obStep?'var(--orange2)':i===obStep?'var(--orange)':'var(--pink-bg)'};width:${i===obStep?'24px':'8px'};transition:all 0.3s;"></div>`).join('');}}
function obNext(data){const vals=Object.values(data);if(vals.some(v=>v===''||v===null||(typeof v==='number'&&isNaN(v)))){alert('Please fill in this field before continuing.');return;}Object.assign(obData,data);obStep++;saveObProgress();if(obStep<obSteps.length)renderObStep();}
function saveObProgress(){try{localStorage.setItem('ob_'+currentUser.id,JSON.stringify({step:obStep,data:obData}));}catch(e){}}
function obNextWeights(){const w1=parseFloat(document.getElementById('ob-w1').value);const w2=parseFloat(document.getElementById('ob-w2').value);if(isNaN(w1)||isNaN(w2)){alert('Please enter both weights before continuing.');return;}obData.weight_last_week=w1;obData.weight_this_week=w2;obData.macro_bodyweight=w2;obStep++;saveObProgress();renderObStep();}
function obBack(){if(obStep>0){obStep--;renderObStep();}}
